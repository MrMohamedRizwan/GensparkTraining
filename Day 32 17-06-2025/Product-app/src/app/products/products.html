

<input type="text" id="search-bar" [(ngModel)]="searchString" (input)="handleSearchProducts()" class="form-control my-3" />

<!-- Product Grid Always Rendered -->
<div class="row fade-in">
<div *ngIf="products.length === 0 && !loading" class="col-12 text-center my-5">
  <h5>No products found.</h5>
</div>
<div class="col-md-4 mb-4" id="card"
     *ngFor="let item of products; trackBy: trackById"
     (click)="viewProduct(item.id)"
     style="cursor: pointer;">
  <app-product [product]="item" [searchTerm]="searchString"></app-product>
</div>


<!-- Loading Spinner Shown During Load -->
<div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border text-success" style="width: 4rem; height: 4rem;" role="status">
    </div>
</div>
