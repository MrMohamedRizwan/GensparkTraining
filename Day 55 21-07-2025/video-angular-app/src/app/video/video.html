<div class="container py-5">
  <div class="row">
    <!-- Upload Section -->
    <div class="col-md-5">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Upload New Video</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="videoForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input
                type="text"
                id="title"
                class="form-control"
                formControlName="title"
                placeholder="Enter video title"
              />
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea
                id="description"
                class="form-control"
                formControlName="description"
                rows="3"
                placeholder="Enter video description"
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="file" class="form-label">Video File</label>
              <input
                type="file"
                id="file"
                class="form-control"
                (change)="onFileChange($event)"
              />
            </div>
            <button type="submit" class="btn btn-success w-100">
              Upload Video
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Video List Section -->
    <div class="col-md-7">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white">
          <h4 class="mb-0">Video Library</h4>
        </div>
        <div class="card-body" style="max-height: 400px; overflow-y: auto">
          <div *ngIf="videos.length === 0" class="text-muted text-center">
            No videos uploaded yet.
          </div>
          <div
            *ngFor="let video of videos"
            class="card mb-3 video-list-item"
            [ngClass]="{'border-primary': selectedVideo?.id === video.id}"
            (click)="onSelect(video.id)"
            style="cursor: pointer"
          >
            <div class="row g-0 align-items-center">
              <div class="col-4">
                <video width="100%" height="80" controls *ngIf="video.blobUrl">
                  <source [src]="video.blobUrl" type="video/mp4" />
                </video>
              </div>
              <div class="col-8">
                <div class="card-body py-2">
                  <h6 class="card-title mb-1">{{ video.title }}</h6>
                  <p class="card-text small text-muted mb-0">
                    {{ video.description }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Selected Video Section -->
      <div *ngIf="selectedVideo" class="card border-success shadow-sm">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">Now Playing</h5>
        </div>
        <div class="card-body">
          <h5 class="card-title">{{ selectedVideo.title }}</h5>
          <p class="card-text">{{ selectedVideo.description }}</p>
          <video width="100%" height="320" controls>
            <source [src]="selectedVideo.blobUrl" type="video/mp4" />
          </video>
        </div>
      </div>
    </div>
  </div>
</div>
