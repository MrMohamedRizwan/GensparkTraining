<div class="container mt-4">
  <h2>Category List</h2>
  <button class="btn btn-success mb-3" (click)="openCreateModal()">
    + Create Category
  </button>

  <table class="table table-bordered table-hover">
    <thead class="thead-dark">
      <tr>
        <th>Name</th>
        <th style="width: 180px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categories">
        <td>{{ cat.name }}</td>
        <td>
          <button
            class="btn btn-sm btn-primary me-2"
            (click)="openEditModal(cat)"
          >
            Edit
          </button>
          <button
            class="btn btn-sm btn-danger"
            (click)="deleteCategory(cat.categoryId)"
          >
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Create Modal -->
<div class="modal fade" id="createModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form [formGroup]="categoryForm" (ngSubmit)="onCreateSubmit()">
        <div class="modal-header">
          <h5 class="modal-title">Create Category</h5>
          <button type="button" class="close" (click)="closeCreateModal()">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="create-name">Category Name</label>
            <input
              type="text"
              id="create-name"
              class="form-control"
              formControlName="name"
            />
            <div
              *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched"
              class="text-danger"
            >
              Name is required.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeCreateModal()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="categoryForm.invalid"
          >
            Create
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form [formGroup]="categoryForm" (ngSubmit)="onEditSubmit()">
        <div class="modal-header">
          <h5 class="modal-title">Edit Category</h5>
          <button type="button" class="close" (click)="closeEditModal()">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="edit-name">Category Name</label>
            <input
              type="text"
              id="edit-name"
              class="form-control"
              formControlName="name"
            />
            <div
              *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched"
              class="text-danger"
            >
              Name is required.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeEditModal()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="categoryForm.invalid"
          >
            Update
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
