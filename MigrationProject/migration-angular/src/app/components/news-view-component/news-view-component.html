<div *ngIf="news" class="container mt-4">
  <h2>News Details</h2>
  <hr />

  <form
    [formGroup]="newsForm"
    (ngSubmit)="onSubmit()"
    *ngIf="isEditMode; else viewMode"
  >
    <div class="mb-3">
      <label>Title</label>
      <input type="text" formControlName="title" class="form-control" />
    </div>

    <div class="mb-3">
      <label>Short Description</label>
      <input
        type="text"
        formControlName="shortDescription"
        class="form-control"
      />
    </div>

    <div class="mb-3">
      <label>Upload New Image</label>
      <input type="file" class="form-control" (change)="onFileChange($event)" />
    </div>

    <div class="mb-3">
      <label>Content</label>
      <textarea
        rows="4"
        formControlName="content"
        class="form-control"
      ></textarea>
    </div>

    <div class="mb-3">
      <label>Status</label>
      <select formControlName="status" class="form-control">
        <option [value]="true">Active</option>
        <option [value]="false">Inactive</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success btn-sm">Submit</button>
    <button
      type="button"
      class="btn btn-secondary btn-sm ms-2"
      (click)="isEditMode = false"
    >
      Cancel
    </button>
  </form>

  <ng-template #viewMode>
    <dl class="row">
      <dt class="col-sm-3">Title</dt>
      <dd class="col-sm-9">{{ news.title }}</dd>

      <dt class="col-sm-3">Short Description</dt>
      <dd class="col-sm-9">{{ news.shortDescription }}</dd>

      <dt class="col-sm-3">Image</dt>
      <dd class="col-sm-9">
        <img
          *ngIf="news.image"
          [src]="'https://plus.unsplash.com/premium_photo-1707080369554-359143c6aa0b?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bmV3c3xlbnwwfHwwfHx8MA%3D%3D'"
          alt="News Image"
          class="img-fluid rounded"
        />
      </dd>

      <dt class="col-sm-3">Content</dt>
      <dd class="col-sm-9">{{ news.content }}</dd>

      <dt class="col-sm-3">Created Date</dt>
      <dd class="col-sm-9">{{ news.createdDate | date: 'medium' }}</dd>

      <dt class="col-sm-3">Status</dt>
      <dd class="col-sm-9">{{ news.status ? 'Active' : 'Inactive' }}</dd>

      <dt class="col-sm-3">Author</dt>
      <dd class="col-sm-9">{{ news.userName }}</dd>
    </dl>

    <div class="mt-3">
      <button class="btn btn-primary btn-sm" (click)="toggleEdit()">
        Edit
      </button>
      <a routerLink="/news-management" class="btn btn-secondary btn-sm ms-2"
        >Back to List</a
      >
    </div>
  </ng-template>
</div>
